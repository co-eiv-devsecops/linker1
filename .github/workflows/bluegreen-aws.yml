name: Blue/Green Deployment (AWS)

# AWS equivalent of bluegreen.yml (OCI): builds, launches a new "green" VM
# next to the running "blue" one behind an Application Load Balancer, runs the
# k6 functional suite against green only, shifts 10% then 100% of the traffic,
# and retires blue. Any failure rolls traffic back to blue and destroys green.
#
# Manual trigger only: AWS Academy Learner Lab credentials expire every few
# hours, so this must never run automatically. Refresh the three AWS_* secrets
# first (scripts/aws/set-lab-secrets.sh) -- see docs/DEPLOYMENT_AWS.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag or SHA) to deploy
        default: main
        required: true

concurrency:
  group: bluegreen-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  REPO_URL: https://github.com/${{ github.repository }}
  LD_SDK_KEY: ${{ secrets.LD_SDK_KEY }}
  MYSQL_PWD: ${{ secrets.MYSQL_PWD }}
  INSTANCE_PROFILE: ${{ vars.AWS_INSTANCE_PROFILE }}

jobs:
  deploy:
    name: Build, test on green, shift traffic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit to deploy
        run: echo "REPO_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build gate
        run: mvn -B -ntp package -DskipTests

      - name: Check AWS credentials
        run: |
          if ! aws sts get-caller-identity --query Arn --output text; then
            echo "::error::AWS credentials missing or expired. Learner Lab credentials last a few hours: start the lab, then run scripts/aws/set-lab-secrets.sh to refresh the secrets."
            exit 1
          fi

      - name: Launch green VM and wait until healthy
        run: scripts/aws/bluegreen.sh launch

      - name: Open test port for this runner
        run: scripts/aws/bluegreen.sh open-test
        id: test

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v1.0.0/k6-v1.0.0-linux-amd64.tar.gz \
            | tar xz --strip-components 1 -C /usr/local/bin k6-v1.0.0-linux-amd64/k6

      - name: Functional tests against green only
        run: TARGET_URL="${{ steps.test.outputs.test_url }}" k6 run tests/k6/switchover-checks.js

      - name: Close test port
        if: always()
        run: scripts/aws/bluegreen.sh close-test

      - name: A/B window (90% blue / 10% green)
        run: scripts/aws/bluegreen.sh ab

      - name: Promote green and retire blue
        run: scripts/aws/bluegreen.sh promote

      - name: Roll back on failure
        if: failure()
        run: scripts/aws/bluegreen.sh rollback

      - name: Public URLs
        if: success()
        run: |
          {
            echo "### Deployed"
            echo '```'
            scripts/aws/bluegreen.sh urls
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
